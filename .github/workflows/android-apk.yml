
name: Build Chibuikem Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Chibuikem_APK_Build_Package.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source
        run: |
          mkdir -p project
          unzip -o Chibuikem_APK_Build_Package.zip -d project
          find project -name gradlew -type f

      - name: Build debug APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chibuikem-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
